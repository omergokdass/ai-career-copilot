# ==============================================================================
# İŞ ARAMA KRİTERLERİ (ÖMER FARUK GÖKDAŞ - TAM KAPSAMLI ÇİFT DALGA TARAMA)
# ==============================================================================

search_queries:
  # Genç Yetenek & Staj
  - "Software Engineering Intern"
  - "Genç Yetenek Yazılım"
  - "Junior Software Engineer"
  
  # C/C++ & Sistem
  - "Junior C++ Developer"
  - "C++ Developer"

  # Backend & Veritabanı
  - "Junior Backend Developer"
  - "Node.js Developer"
  - "NestJS Developer"

  # Frontend & Web & Mobil
  - "Junior Frontend Developer"
  - "TypeScript Developer"
  - "React Native Developer"

  # AI & Sistem / IT Destek
  - "Junior AI Engineer"
  - "AI Developer"
  - "IT Support Specialist"

target_locations:
  - "Istanbul, Turkey"
  - "Turkey (Remote)"

platforms:
  - "LinkedIn"
  - "Kariyer.net"

time_filter: "r86400"  # Son 24 saatteki tüm güncel ilanlar
sort_by: "DD"          # En yeni ilanlar en üstte (Date Descending)
experience_levels: null # Deneyim filtresi kaldırıldı: Deneyim seviyesi eklemiş/eklememiş tüm ilanlar dahil
work_types: ["Remote", "Hybrid", "On-site"]

min_match_score: 50.0

# Sorgu başına limit kaldırıldı: Açılan bütün ilanları eksiksiz tarar
jobs_per_query: null
