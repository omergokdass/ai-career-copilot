# ==============================================================================
# İŞ ARAMA KRİTERLERİ (ÖMER FARUK GÖKDAŞ - 2 VARDİYALI & KISITLAMASIZ SON 24 SAAT)
# ==============================================================================

search_queries:
  # ============================================================================
  # VARDİYA 1 (10:05 TSI): Genç Yetenek, Staj, C/C++ & Sistem, Junior Backend
  # ============================================================================
  - "Software Engineering Intern"
  - "Genç Yetenek Yazılım"
  - "Junior Software Engineer"
  - "Junior C++ Developer"
  - "C++ Developer"
  - "Junior Backend Developer"

  # ============================================================================
  # VARDİYA 2 (14:05 TSI): Frontend & Web, Mobil (React Native), AI & IT Destek
  # ============================================================================
  - "Junior Frontend Developer"
  - "TypeScript Developer"
  - "React Native Developer"
  - "Junior AI Engineer"
  - "AI Developer"
  - "IT Support Specialist"

target_locations:
  - "Istanbul, Turkey"
  - "Turkey"
  - "Remote"

time_filter: "r86400"  # Son 24 saatteki tüm ilanlar
sort_by: "DD"          # En güncel ilanlar öncelikli (Date Descending)
experience_levels: ["1", "2", "3"]
work_types: ["Remote", "Hybrid", "On-site"]

min_match_score: 50.0

# İlan sayısı kısıtlaması kaldırıldı (null: son 24 saatteki tüm ilanlar taranır)
jobs_per_query: null
