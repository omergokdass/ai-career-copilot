name: Daily Job Application Pipeline

on:
  schedule:
    # Günlük Düzenli Vardiyalar (Türkiye Saatiyle: 10:05, 12:05, 14:05, 16:05)
    - cron: '5 7 * * *'    # 10:05 TSI
    - cron: '5 9 * * *'    # 12:05 TSI
    - cron: '5 11 * * *'   # 14:05 TSI
    - cron: '5 13 * * *'   # 16:05 TSI
  workflow_dispatch: # GitHub arayüzünden tek tıkla manuel tetikleme

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Tarayıcısını Hazırla
        run: |
          python -m playwright install --with-deps chromium

      - name: Günlük İlan Taramasını ve AI Analizini Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.8-flash' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: 'true'
        run: |
          python run_automation.py --force --shift auto

      - name: Oluşan Başvuru Raporlarını ve DB'yi Kaydet (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-output
          path: |
            output/
            applications.db
          retention-days: 14
