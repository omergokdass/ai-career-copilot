name: Daily Job Application Pipeline

on:
  schedule:
    # Günde 4 kez Türkiye saatiyle: 10:00, 12:00, 14:00, 16:00 (UTC 07:00, 09:00, 11:00, 13:00)
    - cron: '0 7,9,11,13 * * *'
  workflow_dispatch: # GitHub arayüzünden tek tıkla manuel tetikleme

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Tarayıcısını Hazırla
        run: |
          python -m playwright install --with-deps chromium

      - name: Günlük İlan Taramasını ve AI Analizini Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.8-flash' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: 'true'
        run: |
          python run_automation.py --force --shift auto

      - name: Oluşan Başvuru Raporlarını ve DB'yi Kaydet (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-output
          path: |
            output/
            applications.db
          retention-days: 14
